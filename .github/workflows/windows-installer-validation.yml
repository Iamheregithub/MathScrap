name: Verify teaching Windows installer
on:
  push:
    branches: [installer-validation]
permissions:
  contents: read
  actions: read
jobs:
  install:
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - name: Wait for the application build
        uses: actions/github-script@v7
        with:
          script: |
            const runId = 39698579865;
            for (let attempt = 0; attempt < 240; attempt++) {
              const {data} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId});
              if (data.status === 'completed') {
                if (data.conclusion !== 'success') throw new Error('Application build failed: ' + data.conclusion);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            throw new Error('Application build did not complete in time');
      - uses: actions/download-artifact@v4
        with:
          name: LessonBoard-Windows-x64
          run-id: 39698579865
          github-token: ${{ github.token }}
          path: package
      - uses: actions/download-artifact@v4
        with:
          name: LessonBoard-Windows-x64
          run-id: 39689574008
          github-token: ${{ github.token }}
          path: previous-package
      - name: Install, upgrade, launch native checks, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'validation'
          New-Item -ItemType Directory -Force $dist | Out-Null
          $setup = Get-Item package/*Setup.exe
          $expected = ((Get-Content package/SHA256SUMS.txt -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Installer checksum mismatch' }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\OpenBoardTeachingTest'
          # Start with the previously delivered installer, then upgrade in place.
          $oldSetup = Get-Item previous-package/*Setup.exe
          $oldExpected = ((Get-Content previous-package/SHA256SUMS.txt -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $oldSetup.FullName -Algorithm SHA256).Hash.ToLower() -ne $oldExpected) { throw 'Previous installer checksum mismatch' }
          $oldArgs = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$installed`"")
          $oldProcess = Start-Process $oldSetup.FullName -ArgumentList $oldArgs -PassThru -Wait
          if ($oldProcess.ExitCode -ne 0) { throw 'Previous installation failed' }
          $probeFolder = Join-Path $env:LOCALAPPDATA 'OpenBoardTeaching\document'
          New-Item -ItemType Directory -Force $probeFolder | Out-Null
          $probe = Join-Path $probeFolder 'lessonboard-upgrade-probe.dat'
          'Existing lesson location survives the LessonBoard rename.' | Set-Content $probe
          $probeHash = (Get-FileHash $probe -Algorithm SHA256).Hash
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$installed`"","/LOG=`"$dist\install.log`"")
          $process = Start-Process $setup.FullName -ArgumentList $args -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $exe = Join-Path $installed 'LessonBoard.exe'
          if (!(Test-Path $exe)) { throw 'Installed application missing' }
          if (Test-Path (Join-Path $installed 'OpenBoardTeaching.exe')) { throw 'Previous executable was not cleaned up' }
          if ((Get-FileHash $probe -Algorithm SHA256).Hash -ne $probeHash) { throw 'Upgrade changed existing lesson data' }
          $env:TEACHING_SMOKE_REPORT = Join-Path $dist 'installed-native-report.json'
          $env:QTWEBENGINE_CHROMIUM_FLAGS = '--disable-gpu'
          # Exercise the installed deployment without an installed Qt SDK.
          $process = Start-Process $exe -ArgumentList @('--teaching-smoke-test','-verbose') -WorkingDirectory $installed -PassThru -RedirectStandardError "$dist\installed-stderr.log" -RedirectStandardOutput "$dist\installed-stdout.log"
          if (!$process.WaitForExit(180000)) { Stop-Process -Id $process.Id -Force; throw 'Installed application timed out' }
          Copy-Item "$installed\teaching-crash.log" $dist -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) { throw "Installed application failed: $($process.ExitCode)" }
          $report = Get-Content $env:TEACHING_SMOKE_REPORT -Raw | ConvertFrom-Json
          if (!$report.passed) { throw 'Installed native checks failed' }
          if ($report.documentDirectory -ne $probeFolder.Replace('\','/')) { throw 'Renamed application lost the existing document location' }
          $env:LESSONBOARD_HISTORY_TEST_ROOT = Join-Path $dist 'lesson-history-test'
          $env:QTWEBENGINE_CHROMIUM_FLAGS = '--disable-gpu'
          Remove-Item Env:TEACHING_SMOKE_REPORT -ErrorAction SilentlyContinue
          foreach ($mode in @('exercise','crash','recover')) {
              $env:LESSONBOARD_TOOLS_TEST_MODE = $mode
              $env:LESSONBOARD_TOOLS_TEST_REPORT = Join-Path $dist "lesson-tools-$mode-report.json"
              $p = Start-Process $exe -ArgumentList @('--lesson-tools-test','-verbose') -WorkingDirectory $installed -PassThru -RedirectStandardError "$dist\lesson-tools-$mode-stderr.log" -RedirectStandardOutput "$dist\lesson-tools-$mode-stdout.log"
              if (!$p.WaitForExit(150000)) { Stop-Process -Id $p.Id -Force; throw "Lesson tools timeout: $mode" }
              if ($mode -eq 'crash') {
                  if ($p.ExitCode -ne 89 -or !(Test-Path "$dist\crash-tools-state.json")) {throw 'Forced crash fixture was not prepared'}
              } else {
                  if ($p.ExitCode -ne 0) {throw "Lesson tools failed: $mode, exit $($p.ExitCode)"}
                  $report = Get-Content $env:LESSONBOARD_TOOLS_TEST_REPORT -Raw | ConvertFrom-Json
                  if (!$report.passed) {throw "Lesson tools failed: $($report.detail)"}
              }
          }
          Remove-Item Env:LESSONBOARD_TOOLS_TEST_MODE,Env:LESSONBOARD_TOOLS_TEST_REPORT,Env:LESSONBOARD_HISTORY_TEST_ROOT -ErrorAction SilentlyContinue
          $process = Start-Process "$installed\unins000.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Test-Path $exe)) { throw 'Uninstallation failed' }
          'Installer checksum, upgrade from the previous package, preserved lesson location/data, installed native/PDF checks, and uninstallation passed.' | Set-Content "$dist\installer-result.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-installer-validation
          path: validation
          retention-days: 30
