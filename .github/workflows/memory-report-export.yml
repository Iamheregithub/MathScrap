name: Export existing memory reports
on:
  push:
    branches: [memory-report-export]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reports:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Windows-memory-diagnostics
          run-id: 40795349083
          github-token: ${{ github.token }}
          path: diagnostics
      - name: Report isolation results and available analysis tools
        shell: pwsh
        run: |
          Get-ChildItem diagnostics -Recurse -Filter isolation-report.json | ForEach-Object { Get-Content $_.FullName -Raw }
          Get-ChildItem diagnostics -Recurse -Filter heap-trace-status.json | ForEach-Object { Write-Host $_.FullName; Get-Content $_.FullName -Raw }
          Get-ChildItem diagnostics -Recurse -Filter heap.etl | Select-Object FullName, Length | Format-List
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10" -Recurse -Include umdh.exe,gflags.exe,xperf.exe,wpaexporter.exe -ErrorAction SilentlyContinue | Select-Object FullName | Format-List
      - name: Check trace event integrity
        timeout-minutes: 10
        shell: pwsh
        run: |
          $xperf = "${env:ProgramFiles(x86)}/Windows Kits/10/Windows Performance Toolkit/xperf.exe"
          $trace = Get-ChildItem diagnostics -Recurse -Filter heap.etl | Select-Object -First 1
          New-Item -ItemType Directory -Force diagnostics/analysis | Out-Null
          & $xperf -i $trace.FullName -o "$PWD/diagnostics/analysis/trace-statistics.txt" -a tracestats *> diagnostics/analysis/tracestats.log
          @{ exitCode=$LASTEXITCODE } | ConvertTo-Json | Set-Content diagnostics/analysis/tracestats-status.json
          if ($LASTEXITCODE -ne 0) { throw 'Trace statistics failed' }
      - name: Upload small memory reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Memory-isolation-reports
          path: |
            diagnostics/**/*.json
            diagnostics/**/*.jsonl
            diagnostics/**/*.log
            diagnostics/analysis/*.txt
          if-no-files-found: error
          retention-days: 30
